[project]
name = "memory-online-sdk"
version = "0.1.0"
description = "Layered online tutoring memory: retrieve + commit_turn (process-local SDK)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "openai>=1.0",
  "torch>=2.0",
  "FlagEmbedding>=1.2",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
